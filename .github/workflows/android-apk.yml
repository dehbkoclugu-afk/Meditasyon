# Elle tetiklenen APK derlemesi: expo prebuild + gradle.
# Çıktı: Actions run sayfasından indirilebilir "sakin-apk" artifact'i.
# İmza: Expo şablonunun varsayılanı (debug keystore) — test/sideload için;
# mağaza yayını EAS production build ile yapılır (docs/RELEASE.md).
name: Android APK

on:
  workflow_dispatch:
  # .apk-trigger dosyası değişince derlenir (normal push'lar APK üretmez)
  push:
    branches:
      - 'claude/**'
    paths:
      - '.apk-trigger'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Runner diski RN release paketlemesine dar geliyor — kullanılmayan
      # önyüklü araçları silerek ~20GB aç
      - name: Disk temizliği
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: Bağımlılıklar
        run: npm ci

      # Yamanın gerçekten uygulandığını doğrula — uygulanamazsa build durur
      - name: Yamaları doğrula
        run: |
          npx patch-package --error-on-fail
          F=node_modules/react-native-track-player/android/src/main/java/com/doublesymmetry/trackplayer/module/MusicModule.kt
          echo "=== void'e çevrilen coroutine metot sayısı ==="
          grep -c ") { scope.launch {" "$F"
          echo "=== kalan Job dönen @ReactMethod (0 olmalı) ==="
          grep -c "= scope.launch {" "$F" || true

      - name: Android projesini üret (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Yamaları tekrar doğrula (prebuild sonrası)
        run: npx patch-package --error-on-fail

      # Yalnız gerçek cihaz (arm64) + emülatör (x86_64) mimarileri:
      # derleme süresi ve disk yarıya iner, APK küçülür
      - name: Mimarileri daralt
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,x86_64/' android/gradle.properties
          grep reactNativeArchitectures android/gradle.properties

      - name: APK derle
        # packageRelease bazen IncrementalSplitterRunnable ile flaky patlıyor;
        # bir kez otomatik yeniden dene, hata sürerse --stacktrace nedeni basar.
        run: cd android && (./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleRelease --no-daemon --stacktrace)

      - name: Disk durumu
        if: always()
        run: df -h /

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: sakin-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # Duman testi: APK emülatörde açılıyor mu? Çökerse stack log'a düşer.
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: APK'yı indir
        uses: actions/download-artifact@v4
        with:
          name: sakin-apk

      - name: KVM izinleri
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde aç ve logcat topla
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install app-release.apk
            adb logcat -c
            # 1) Açılış
            adb shell monkey -p com.sakin.meditasyon -c android.intent.category.LAUNCHER 1
            sleep 12
            adb shell pidof com.sakin.meditasyon && echo "ACILIS: SUREC CALISIYOR" || echo "ACILIS: SUREC OLU"
            # 2) Player'a gir (deep link) — RNTP/ses yolu burada tetiklenir
            adb shell am start -a android.intent.action.VIEW -d "sakin://player/baslangic-gun-1" com.sakin.meditasyon
            sleep 25
            adb logcat -d > logcat.txt
            echo "===== UYGULAMA IZLERI ====="
            grep -E "sakin|AndroidRuntime|ReactNativeJS|E ReactNative|Hermes|hermes|nitro|Nitro|MMKV|mmkv|TrackPlayer|track_player|SoLoader|UnsatisfiedLink|ExoPlayer|MediaService|ForegroundService" logcat.txt | tail -200 || true
            # emulator-runner script'i satir satir calistirir — her kontrol TEK satir olmali (cok satirli if/fi bolunur).
            if grep -qE "FATAL EXCEPTION|Fatal signal|tombstoned|SIGSEGV|SIGABRT|ForegroundServiceStartNotAllowedException|Showing crash dialog" logcat.txt; then echo "::error::Cokme izi bulundu (logcat.txt artifact)"; grep -B 2 -A 40 -E "FATAL EXCEPTION|Fatal signal|tombstoned" logcat.txt | head -140; exit 1; fi
            if ! adb shell pidof com.sakin.meditasyon > /dev/null; then echo "::error::Surec oldu - player'a girince coktu"; exit 1; fi
            if ! grep -q "SAKIN_UI_READY" logcat.txt; then echo "::error::UI mount olmadi - splash/blank ekranda takildi"; exit 1; fi
            echo "OK: UI mount oldu + player acildi, cokme yok"

      - name: Logcat'i yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: logcat.txt
          if-no-files-found: ignore
