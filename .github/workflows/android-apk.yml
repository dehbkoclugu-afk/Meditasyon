# Elle tetiklenen APK derlemesi: expo prebuild + gradle.
# Çıktı: Actions run sayfasından indirilebilir "sakin-apk" artifact'i.
# İmza: Expo şablonunun varsayılanı (debug keystore) — test/sideload için;
# mağaza yayını EAS production build ile yapılır (docs/RELEASE.md).
name: Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıklar
        run: npm ci

      - name: Android projesini üret (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: APK derle
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: sakin-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
